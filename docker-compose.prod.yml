services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: honafresh_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webbanrau_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-webbanrau_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - honafresh_net

  redis:
    image: redis:alpine
    container_name: honafresh_redis_prod
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - honafresh_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: honafresh_backend_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx512m -Xms256m}
      SERVER_PORT: 8080
      SERVER_CONTEXT_PATH: /api/v1

      # Database & Redis nội bộ Docker network
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-webbanrau_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}

      # Security & CORS
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_SECONDS: ${JWT_ACCESS_SECONDS:-900}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

      # External Services
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER:-}
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-}
      IOT_INGEST_KEY: ${IOT_INGEST_KEY:-hona-iot-prod-key-2026}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/categories >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - honafresh_net

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  honafresh_net:
    driver: bridge
