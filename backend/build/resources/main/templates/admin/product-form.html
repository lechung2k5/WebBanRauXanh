<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/layout :: navbar('products')}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-pencil-square text-warning me-2"></i>
                        <span th:text="${pageTitle}">Thêm Sản Phẩm Mới</span>
                    </h5>
                    <a th:href="@{/products}" class="btn btn-outline-light btn-sm rounded-3">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại
                    </a>
                </div>

                <div class="card-body p-4 p-sm-5">
                    <!-- Form lưu sản phẩm: POST /admin/products/save với CSRF -->
                    <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
                        <!-- Hidden ID if editing -->
                        <input type="hidden" th:field="*{id}">

                        <!-- Tên sản phẩm -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Tên sản phẩm *</label>
                            <input type="text" th:field="*{name}" class="form-control rounded-3"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   id="name" placeholder="Ví dụ: Rau Xà Lách Mỡ Đà Lạt">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <!-- Giá bán -->
                        <div class="mb-3">
                            <label for="price" class="form-label fw-semibold">Giá bán (VNĐ) *</label>
                            <input type="number" step="1000" th:field="*{price}" class="form-control rounded-3"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                   id="price" placeholder="Ví dụ: 25000">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>

                        <!-- Mô tả -->
                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold">Mô tả sản phẩm</label>
                            <textarea th:field="*{description}" class="form-control rounded-3" rows="4"
                                      id="description" placeholder="Nhập thông tin chi tiết về sản phẩm..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/products}" class="btn btn-outline-secondary px-4 rounded-3">Hủy</a>
                            <button type="submit" class="btn btn-warning fw-bold text-dark px-4 rounded-3 shadow-sm">
                                <i class="bi bi-save2-fill me-1"></i> Lưu thông tin
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
