<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Quản lý người dùng')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/layout :: navbar('users')}"></div>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-1">
                <i class="bi bi-people-fill text-warning me-2"></i> Quản Lý Tài Khoản
            </h2>
            <p class="text-muted mb-0">Xem danh sách người dùng và thực hiện khoá / mở khoá tài khoản</p>
        </div>
    </div>

    <!-- Alert thông báo -->
    <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
        <i class="bi bi-check-circle-fill fs-4 me-3"></i>
        <div>
            <strong th:text="${successMessage}">Thao tác thành công!</strong>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill fs-4 me-3"></i>
        <div>
            <strong th:text="${errorMessage}">Lỗi!</strong>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Users Table Card -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="py-3 ps-4">ID</th>
                        <th class="py-3">Tên đăng nhập</th>
                        <th class="py-3">Họ và tên</th>
                        <th class="py-3">Email</th>
                        <th class="py-3">Vai trò (Roles)</th>
                        <th class="py-3">Trạng thái</th>
                        <th class="py-3 text-center">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td class="ps-4 fw-bold" th:text="${u.id}">1</td>
                        <td>
                            <strong class="text-dark" th:text="${u.username}">admin</strong>
                        </td>
                        <td th:text="${u.fullName}">Quản Trị Viên</td>
                        <td class="text-muted" th:text="${u.email}">admin@example.com</td>
                        <td>
                            <span th:each="r : ${u.roles}"
                                  th:class="${r.name == 'ROLE_ADMIN'} ? 'badge bg-danger me-1' : 'badge bg-info text-dark me-1'"
                                  th:text="${r.name}">
                                ROLE_USER
                            </span>
                        </td>
                        <td>
                            <span th:if="${u.enabled}" class="badge bg-success-subtle text-success fs-6 fw-semibold px-2 py-1">
                                <i class="bi bi-check-circle me-1"></i> Đang hoạt động
                            </span>
                            <span th:unless="${u.enabled}" class="badge bg-danger-subtle text-danger fs-6 fw-semibold px-2 py-1">
                                <i class="bi bi-lock-fill me-1"></i> Đã bị khoá
                            </span>
                        </td>
                        <td class="text-center pe-4">
                            <!-- Nút Khoá / Mở khoá tài khoản -->
                            <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post" class="d-inline"
                                  th:if="${u.username != 'admin'}">
                                <button type="submit"
                                        th:class="${u.enabled} ? 'btn btn-outline-danger btn-sm rounded-3' : 'btn btn-outline-success btn-sm rounded-3'"
                                        th:title="${u.enabled} ? 'Khoá tài khoản này' : 'Mở khoá tài khoản này'">
                                    <i th:class="${u.enabled} ? 'bi bi-lock-fill me-1' : 'bi bi-unlock-fill me-1'"></i>
                                    <span th:text="${u.enabled} ? 'Khoá' : 'Mở khoá'">Khoá</span>
                                </button>
                            </form>
                            <span th:if="${u.username == 'admin'}" class="badge bg-secondary-subtle text-secondary small">
                                Mặc định
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
