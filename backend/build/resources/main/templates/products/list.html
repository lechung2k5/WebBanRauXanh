<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Danh sách sản phẩm')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/layout :: navbar('products')}"></div>

<div class="container my-5">
    <!-- Header & Action button -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
            <h2 class="fw-bold text-dark mb-1">
                <i class="bi bi-box-seam-fill text-warning me-2"></i> Danh Sách Sản Phẩm
            </h2>
            <p class="text-muted mb-0">Quản lý và hiển thị thông tin sản phẩm trong hệ thống</p>
        </div>

        <!-- Chỉ ADMIN mới thấy nút Thêm sản phẩm mới (sec:authorize) -->
        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/products/new}" class="btn btn-warning btn-lg fw-bold rounded-3 shadow-sm text-dark">
                <i class="bi bi-plus-circle-fill me-1"></i> Thêm Sản Phẩm Mới
            </a>
        </div>
    </div>

    <!-- Alert thông báo thành công nếu có -->
    <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
        <i class="bi bi-check-circle-fill fs-4 me-3"></i>
        <div>
            <strong th:text="${successMessage}">Thao tác thành công!</strong>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Search Form -->
    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body p-3">
            <form th:action="@{/products}" method="get" class="row g-2 align-items-center">
                <div class="col-md-9 col-sm-8">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control border-start-0" placeholder="Tìm kiếm theo tên sản phẩm...">
                    </div>
                </div>
                <div class="col-md-3 col-sm-4 d-flex gap-2">
                    <button type="submit" class="btn btn-dark w-100 rounded-3">Tìm kiếm</button>
                    <a th:if="${keyword != null and keyword != ''}" th:href="@{/products}" class="btn btn-outline-secondary rounded-3">Xóa lọc</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Products Table Card -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="py-3 ps-4" style="width: 80px;">ID</th>
                        <th class="py-3">Tên sản phẩm</th>
                        <th class="py-3">Giá bán</th>
                        <th class="py-3">Mô tả</th>
                        <th class="py-3 text-center" style="width: 220px;">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="5" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary"></i>
                            Không có sản phẩm nào phù hợp!
                        </td>
                    </tr>
                    <tr th:each="product : ${products}">
                        <td class="ps-4 fw-bold" th:text="${product.id}">1</td>
                        <td>
                            <a th:href="@{/products/{id}(id=${product.id})}" class="fw-bold text-dark text-decoration-none hover-link" th:text="${product.name}">
                                Tên sản phẩm
                            </a>
                        </td>
                        <td>
                            <span class="badge bg-success-subtle text-success fs-6 fw-bold px-2 py-1"
                                  th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                                25.000 VNĐ
                            </span>
                        </td>
                        <td class="text-muted" th:text="${product.description}">Mô tả ngắn...</td>
                        <td class="text-center pe-4">
                            <div class="btn-group" role="group">
                                <!-- Nút Xem chi tiết: Cả USER và ADMIN đều thấy -->
                                <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-outline-primary btn-sm rounded-2 me-1" title="Xem chi tiết">
                                    <i class="bi bi-eye"></i>
                                </a>

                                <!-- Nút Sửa: Chỉ ADMIN mới thấy (sec:authorize) -->
                                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn btn-outline-warning btn-sm text-dark rounded-2 me-1" title="Chỉnh sửa">
                                    <i class="bi bi-pencil-square"></i>
                                </a>

                                <!-- Nút Xoá: Chỉ ADMIN mới thấy (sec:authorize) -->
                                <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Bạn có chắc chắn muốn xoá sản phẩm này không?');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm rounded-2" title="Xoá">
                                        <i class="bi bi-trash3"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
