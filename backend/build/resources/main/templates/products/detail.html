<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Chi tiết sản phẩm')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/layout :: navbar('products')}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-info-circle-fill text-warning me-2"></i> Chi Tiết Sản Phẩm</h5>
                    <a th:href="@{/products}" class="btn btn-outline-light btn-sm rounded-3">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại
                    </a>
                </div>

                <div class="card-body p-4 p-sm-5">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <span class="text-muted small">MÃ SẢN PHẨM</span>
                            <h4 class="fw-bold text-secondary mb-3">#<span th:text="${product.id}">1</span></h4>

                            <span class="text-muted small">TÊN SẢN PHẨM</span>
                            <h3 class="fw-bold text-dark mb-3" th:text="${product.name}">Tên sản phẩm</h3>

                            <span class="text-muted small">GIÁ BÁN NIÊM YẾT</span>
                            <div class="mb-3">
                                <span class="badge bg-success-subtle text-success fs-4 fw-bold px-3 py-2"
                                      th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                                    25.000 VNĐ
                                </span>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <span class="text-muted small">MÔ TẢ CHI TIẾT</span>
                            <div class="p-3 bg-light rounded-3 border mt-1">
                                <p class="mb-0 text-muted" th:text="${product.description != null and product.description != '' ? product.description : 'Chưa có mô tả chi tiết cho sản phẩm này.'}">
                                    Mô tả sản phẩm...
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Action buttons (Only ADMIN can edit/delete) -->
                    <div class="mt-5 pt-3 border-top d-flex gap-2 justify-content-end" sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn btn-warning fw-bold text-dark px-4 rounded-3">
                            <i class="bi bi-pencil-square me-1"></i> Chỉnh sửa
                        </a>
                        <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post"
                              onsubmit="return confirm('Bạn có chắc muốn xoá sản phẩm này?');">
                            <button type="submit" class="btn btn-danger px-4 rounded-3">
                                <i class="bi bi-trash3 me-1"></i> Xoá
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
