# =============================================================================
# HONA FRESH - Production Profile (AWS EC2)
# Kích hoạt qua: SPRING_PROFILES_ACTIVE=prod
# =============================================================================

# Tương thích Reverse Proxy (Nginx / AWS ALB / HTTPS) cho REST & WebSocket
server.forward-headers-strategy=framework

# Tắt log SQL thừa ở production để giảm tải CPU/Disk I/O
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Tối ưu HikariCP cho EC2 (t2.micro / t3.small / t3.medium)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Tắt Swagger UI mặc định ở production (bật lại bằng SWAGGER_ENABLED=true nếu cần test)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Giữ log gọn, rõ ràng trên Docker logs
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.com.btl.webbanrau=INFO
