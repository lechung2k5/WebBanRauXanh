server.port=8080
server.servlet.context-path=/api/v1

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/webbanrau_db
spring.datasource.username=postgres
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger OpenAPI UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security & CORS Settings
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
logging.level.org.springframework.security=INFO

# Google AI Studio / Gemini API (Nạp an toàn từ biến môi trường hoặc file .gemini_api_key)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model.chat=gemini-3.5-flash-lite
gemini.model.embedding=gemini-embedding-001
