server.port=8080
server.servlet.context-path=/api/v1

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/webbanrau_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger OpenAPI UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security & CORS Settings
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
logging.level.org.springframework.security=INFO

# Google AI Studio / Gemini API (Nạp an toàn từ biến môi trường hoặc file .gemini_api_key)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model.chat=gemini-3.5-flash-lite
gemini.model.embedding=gemini-embedding-001

# Migration baseline 1 preserves existing databases; new databases run V1 first.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# JWT Secret & Expiration
app.jwt.secret=${JWT_SECRET:hona-fresh-super-secure-jwt-secret-key-production-ready-2026-min-32-bytes}
app.jwt.access-seconds=${JWT_ACCESS_SECONDS:900}

# Google OAuth2 Client ID (Dành cho Google Sign-In)
app.google.client-id=${GOOGLE_CLIENT_ID:}

# JavaMailSender / Gmail SMTP
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${GMAIL_USERNAME:honafresh.service@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:honafresh.service@gmail.com}

