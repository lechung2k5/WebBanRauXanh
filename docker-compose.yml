version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: webbanrau_postgres
    restart: always
    environment:
      POSTGRES_DB: webbanrau_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: security_demo_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
